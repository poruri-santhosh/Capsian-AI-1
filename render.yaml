services:
  - type: web
    name: capsian-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash-pro